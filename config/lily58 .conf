# --- DISPLAY (OLED) ---
CONFIG_ZMK_DISPLAY=y
# Zeigt Batteriestatus und Output-Status (Bluetooth/USB) an
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# --- POWER ---
CONFIG_ZMK_EXT_POWER=y
# Verhindert, dass OLEDs/RGB im Idle ausgehen (Dein Wunsch)
CONFIG_ZMK_SLEEP=n 
# Falls du doch Sleep willst: 3600000 ms = 1 Stunde
CONFIG_ZMK_IDLE_TIMEOUT=3600000

# --- RGB (Underglow & Per-Key) ---
# WICHTIG: In ZMK werden oft alle LEDs (Tasten + Boden) als "Underglow" via WS2812 Strip gesteuert
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Standard-Einstellungen beim Start
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
# Optional: Hue/Sat anpassen (z.B. Rot als Startfarbe)
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# RGB nicht ausschalten, wenn USB getrennt wird (Akkufresser!)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# --- WIRELESS ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- ZMK STUDIO ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n