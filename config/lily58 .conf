# --- DISPLAY EINSTELLUNGEN ---
# Aktiviert das OLED Display
CONFIG_ZMK_DISPLAY=y

# --- RGB EINSTELLUNGEN ---
# Aktiviert RGB Underglow / Per-Key RGB
CONFIG_ZMK_RGB_UNDERGLOW=y
# Erforderlicher Treiber für die WS2812 LEDs der Lily58
CONFIG_WS2812_STRIP=y

# --- ENERGIESPAR-OPTIONEN ---
# Schaltet RGB aus, wenn die Tastatur nicht benutzt wird (Idle)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Zeit in Millisekunden bis zum Idle-Modus (hier 30 Sek.)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Verringert die Standard-Helligkeit beim Start auf 10% (schont den Akku)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

# --- ZMK STUDIO ---
# Stellt sicher, dass ZMK Studio Änderungen speichern kann
CONFIG_ZMK_STUDIO=y