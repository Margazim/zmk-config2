# --- DISPLAY & POWER ---
# Aktiviert das OLED und erzwingt die Stromversorgung beim Start
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# --- RGB EINSTELLUNGEN (IMMER AN) ---
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Deaktiviert automatisches Ausschalten bei Inaktivität oder USB-Trennung
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
# Setzt die Starthelligkeit auf 50%
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# --- ENERGIESPAR-MODI DEAKTIVIEREN ---
# Verhindert den Deep Sleep und setzt das Idle-Timeout extrem hoch
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=3600000

# --- ZMK STUDIO ---
CONFIG_ZMK_STUDIO=y
# Deaktiviert die Sperre, damit Studio sofort eine Verbindung herstellen kann
CONFIG_ZMK_STUDIO_LOCKING=n