# --- POWER & DISPLAY ---
# Aktiviert das OLED und erzwingt die Stromversorgung beim Start
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# --- RGB EINSTELLUNGEN (STROMFRESSER) ---
# Hinweis: RGB verkürzt die Akkulaufzeit drastisch!
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# RGB bleibt an, auch wenn die Tastatur nicht getippt wird
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40

# --- WIRELESS OPTIMIERUNG ---
# Erhöht die Sendeleistung für eine stabilere Verbindung zwischen den Hälften
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Deaktiviert den Deep Sleep, damit OLEDs nicht ausgehen
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=3600000

# --- ZMK STUDIO (USB-VERBINDUNG) ---
# ZMK Studio funktioniert nur über USB an der linken (zentralen) Hälfte!
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n